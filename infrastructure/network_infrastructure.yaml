network:
  name: Enterprise Network
  environment: Production

devices:
  routers:

    - hostname: R1
      vendor: Cisco
      ip_address: 10.0.0.1
      role: Core Router

    - hostname: R2
      vendor: Cisco
      ip_address: 10.0.0.2
      role: Backup Router

  switches:

    - hostname: SW1
      vendor: Cisco
      management_ip: 10.0.0.10
      vlans:
        - 10
        - 20
        - 30

    - hostname: SW2
      vendor: Cisco
      management_ip: 10.0.0.11
      vlans:
        - 10
        - 20
        - 30

  servers:

    - hostname: API-SERVER
      ip_address: 172.16.0.10
      role: REST API Server

    - hostname: DATABASE-SERVER
      ip_address: 172.16.0.20
      role: Database Server

    - hostname: AUTH-SERVER
      ip_address: 172.16.0.40
      role: Authentication Server

